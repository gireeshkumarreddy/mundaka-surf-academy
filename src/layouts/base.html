<!doctype html>
<html lang="{{locale}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>(function(c){c.add('js');if(location.hash)c.add('cv-off');if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;c.add('motion-pending');try{if(sessionStorage.getItem('msa:nav')){c.add('is-entering');sessionStorage.removeItem('msa:nav')}}catch(e){}})(document.documentElement.classList)</script>
  <title>{{meta.title}}</title>
  <meta name="description" content="{{meta.description}}">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{config.brand.name}}">
  <meta property="og:title" content="{{meta.title}}">
  <meta property="og:description" content="{{meta.description}}">
  <meta property="og:image" content="{{src:mundaka-santa-catalina@1600}}">
  <meta property="og:locale" content="{{common.ogLocale}}">
  {{head-extra}}
  <link rel="icon" href="{{asset:favicon-48.png}}" sizes="48x48" type="image/png">
  <link rel="icon" href="{{asset:favicon-192.png}}" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="{{asset:apple-touch-icon.png}}">
  {{#unless page.noFontPreload}}<link rel="preload" href="{{asset:fonts/archivo-normal-latin.woff2}}" as="font" type="font/woff2" crossorigin>{{/unless}}
  <link rel="stylesheet" href="{{asset:css/site.css}}">
  {{site-config}}
  <link rel="modulepreload" href="{{asset:js/motion.js}}">
  <link rel="modulepreload" href="{{asset:js/integrations/config.js}}">
  <link rel="modulepreload" href="{{asset:js/integrations/whatsapp.js}}">
  <link rel="modulepreload" href="{{asset:js/interactions.js}}">
  <script defer src="{{asset:vendor/lenis.min.js}}"></script>
  <script type="module" src="{{asset:js/main.js}}"></script>
</head>
<body class="page-{{page.key}}" data-page="{{page.key}}" data-header="{{page.header}}" data-review="{{config.reviewMode}}">
  {{> header}}
  <main id="main" tabindex="-1">
{{content}}
  </main>
  {{> footer}}
</body>
</html>
