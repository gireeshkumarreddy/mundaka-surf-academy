<div class="embed embed--map" data-embed data-src="{{config.maps.embed}}" data-title="{{common.embed.mapTitle}}">
  <div class="embed__ph">
    <svg class="icon embed__icon" aria-hidden="true"><use href="#i-pin"/></svg>
    <p class="embed__name">{{config.contact.address}}</p>
    <p class="embed__text">{{common.embed.mapText}}</p>
    <button type="button" class="btn btn--teal btn--sm" data-embed-load>{{common.embed.mapLoad}}</button>
  </div>
</div>
