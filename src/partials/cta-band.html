<section class="cta-band" aria-labelledby="cta-band-title">
  <div class="container cta-band__inner" data-reveal>
    <div>
      <p class="eyebrow">{{cta.eyebrow}}</p>
      <h2 class="cta-band__title" id="cta-band-title">{{cta.title}}</h2>
    </div>
    <div class="cta-band__actions">
      <a class="btn btn--accent btn--pill" href="{{link:contact#booking}}">{{common.cta.book}}<span class="btn__plus" aria-hidden="true"><svg class="icon"><use href="#i-plus"/></svg></span></a>
      <a class="link-arrow" href="{{link:plans}}">{{cta.plans}}<svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg></a>
    </div>
  </div>
</section>
